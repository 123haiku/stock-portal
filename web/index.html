<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Stock &amp; Quotation Portal</title>
    <style>
      /* Capacitor's safe-area helper writes custom properties onto :root and
         expects the viewport to use safe-area insets; declaring them here avoids
         the "cannot read style of null" it otherwise raises on devices without a
         notch. */
      :root {
        --safe-area-inset-top: env(safe-area-inset-top, 0px);
        --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-inset-left: env(safe-area-inset-left, 0px);
        --safe-area-inset-right: env(safe-area-inset-right, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        padding-top: var(--safe-area-inset-top);
        padding-bottom: var(--safe-area-inset-bottom);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- Capacitor's native safe-area bridge looks up a stylesheet element by id and
         writes CSS custom properties into it. The element must exist before the
         bridge runs, otherwise it logs "Error injecting safe area CSS". -->
    <style id="capacitor-safe-area"></style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
